server {
    listen 80;
    server_name taski-gresh.duckdns.org;

    location /api/ {
        client_max_body_size 20M;
        proxy_pass http://127.0.0.1:8000;
    }

    location /admin/ {
        client_max_body_size 20M;
        proxy_pass http://127.0.0.1:8000;
    }

    location /media/ {
        alias /var/www/taski/media/;
    }

    location /static_backend/ {
        alias /var/www/taski/static_backend/;
    }

    location / {
        root /var/www/taski;
        index index.html index.htm;
        try_files $uri /index.html;
    }
}
